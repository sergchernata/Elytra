# Arc fork: builds Ladybird for Apple Silicon Macs and publishes it as a GitHub release.
#
# Runs when a tag named arc-v* is pushed (the release takes the tag's name), or by hand from the Actions tab
# (the release is tagged arc-<date>-<commit>). Uses upstream's setup, cache and packaging steps (see
# lagom-template.yml), so it keeps working as those change.

name: Arc release (macOS, Apple Silicon)

on:
  push:
    tags: ['arc-v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Build steps (vcpkg ports, scripts) get read access only; publishing is a separate job (see below).
permissions:
  contents: read

env:
  # Same as upstream CI: ccache and vcpkg caches live in the workspace so they can be restored and saved.
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: "%compiler% -v"

jobs:
  build:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      zip: ${{ steps.package.outputs.zip }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Environment
        uses: ./.github/actions/setup
        id: setup
        with:
          os: macOS
          arch: arm64
          toolchain: Clang
          build_preset: Release

      - name: Restore Caches
        uses: ./.github/actions/cache-restore
        id: cache-restore
        with:
          os: macOS
          arch: arm64
          toolchain: Clang
          cache_key_extra: Release-arc
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}

      - name: Name the release
        id: release
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="arc-$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          CC="$(xcrun --find clang)"
          CXX="$(xcrun --find clang++)"
          # vcpkg builds its ports with the same compiler.
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          # ENABLE_CI_BASELINE_CPU: code for any Apple Silicon Mac, not just the build machine's CPU.
          CC="$CC" CXX="$CXX" cmake --preset Release -B Build \
            -DENABLE_CI_BASELINE_CPU=ON \
            -DBUILD_TESTING=OFF \
            -DARC_RELEASE_TAG="${{ steps.release.outputs.tag }}" \
            -DARC_RELEASE_REPOSITORY="${GITHUB_REPOSITORY}" \
            -DPython3_EXECUTABLE=${{ env.pythonLocation }}/bin/python \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        working-directory: ${{ github.workspace }}/Build
        run: |
          cmake --build .
          cmake --install . --strip --prefix "${GITHUB_WORKSPACE}/Install"

      - name: Save Caches
        if: always()
        uses: ./.github/actions/cache-save
        with:
          arch: arm64
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

      - name: Package Ladybird.app
        id: package
        run: |
          # Upstream's packager makes the bundle self-contained (Qt and libraries inside) and signs it ad hoc.
          "${{ env.pythonLocation }}/bin/python" Meta/package-macos-app-bundle.py \
            --build-dir Build --install-dir Install --output ladybird-app-bundle.tar.gz

          TAG="${{ steps.release.outputs.tag }}"
          ZIP="Ladybird-${TAG}-macOS-arm64.zip"

          mkdir -p staging
          tar -xzf ladybird-app-bundle.tar.gz -C staging
          APP="$(find staging -maxdepth 3 -name Ladybird.app -type d | head -1)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Keep the package for publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          compression-level: 0

  # The only job with write access or the signing key: it signs and publishes what the build made, and runs nothing
  # from the build.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-package

      # Only for the public key the app trusts, to check the signature against it.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          path: source
          sparse-checkout: UI/Qt/Arc/ReleaseSignature.h
          sparse-checkout-cone-mode: false

      # The app installs only downloads signed with the release key (see UI/Qt/Arc/ReleaseSignature.h). The key is
      # in the ARC_RELEASE_SIGNING_KEY secret (an Ed25519 private key, PEM); without it, nothing is published.
      - name: Sign the release
        env:
          SIGNING_KEY: ${{ secrets.ARC_RELEASE_SIGNING_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::The ARC_RELEASE_SIGNING_KEY secret isn't set; refusing to publish an unsigned release."
            exit 1
          fi
          KEY="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$KEY")

          # Keep in step with release_statement() in UI/Qt/Arc/ReleaseSignature.cpp.
          SHA256="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          printf 'ladybird-arc-release\ntag: %s\nfile: %s\nsha256: %s\n' "$TAG" "$ZIP" "$SHA256" > statement.txt
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in statement.txt -out signature.bin
          base64 -w0 signature.bin > "$ZIP.sig"

          # Check it the way the app will, with the app's public key, so a mismatched key fails here, not in the app.
          PUBLIC_KEY="$(sed -n 's/.*RELEASE_PUBLIC_KEY_BASE64\[\] = "\([^"]*\)".*/\1/p' source/UI/Qt/Arc/ReleaseSignature.h)"
          test -n "$PUBLIC_KEY"
          { printf '302a300506032b6570032100' | xxd -r -p; printf '%s' "$PUBLIC_KEY" | base64 -d; } > public-key.der
          openssl pkeyutl -verify -pubin -keyform DER -inkey public-key.der -rawin -in statement.txt -sigfile signature.bin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          cat > notes.md <<'EOF'
          Elytra: Ladybird with an Arc-style interface, built for Apple Silicon Macs (arm64, macOS 14.4 or later).

          The app is signed ad hoc, not notarized, so macOS blocks it the first time. After unzipping, either
          right-click Ladybird.app and choose Open, or run:

              xattr -dr com.apple.quarantine /path/to/Ladybird.app

          Once installed, it updates itself from here. Updates are signed; the .sig file is the download's signature.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Elytra $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$ZIP" "$ZIP.sha256" "$ZIP.sig"
